# Scylla Hunter configuration
# Business assumptions (ICP, weights, thresholds, messaging) are ASSUMPTIONS for the PoC.
# In production the GTM team calibrates them against real outcomes (accept / reply / meeting rates).
# Every number here is referenced by PRD.md section 9 (Scoring model).

as_of: "2026-10-08"              # fixed "today" for fixtures, so scores and tests are deterministic

campaign:
  name: "DataStax displacement - Q4 2026"
  competitor: "DataStax"
  competitor_products: ["Astra DB", "DataStax Enterprise (DSE)", "Apache Cassandra"]

# ---------- Runtime switches ----------
runtime:
  dry_run: true                  # never really send; write to console + outbox.jsonl
  approval_mode: threshold       # all | threshold | off   (see hitl)
  db_path: "hunter.db"
  outbox_path: "out/outbox.jsonl"       # git-ignored; see scripts/regenerate_examples.sh for the committed examples/ snapshot
  report_path: "out/report.md"
  report_html_path: "out/report.html"

llm:
  mode: replay                   # replay (default, no key) | live (needs ANTHROPIC_API_KEY)
  replay_dir: "data/llm_replay"
  models:
    extraction: "claude-haiku-5-5"       # simple structured extraction -> cheaper model
    personalization: "claude-opus-5-5"   # customer-facing writing -> strongest model
  max_tokens:
    extraction: 400
    personalization: 1200   # effort:medium can spend ~500 tokens on hidden thinking before the
                             # actual draft; 700 was observed truncating mid-response (stop_reason:
                             # max_tokens) - see AI_WORKFLOW.md
  effort:                        # reasoning effort (low|medium|high|xhigh|max) - this model family has
    extraction: "low"            # no temperature param; it spends part of max_tokens on hidden
    personalization: "medium"    # thinking unless told not to. "low" keeps extraction fast and cheap;
                                  # "medium" leaves room for better customer-facing writing.
  max_retries_on_validation_fail: 1      # then route to human review

# ---------- Account level ----------
icp:
  min_employees: 100             # gate: below -> REJECTED; unknown -> NEEDS_ENRICHMENT
  priority_industries: [fintech, adtech, gaming, ai_ml, logistics, ecommerce, telecom]
  employee_bands:
    - { min: 100,  max: 499,  points: 10 }
    - { min: 500,  max: 1999, points: 15 }
    - { min: 2000, max: null, points: 20 }
  industry_bonus: 5              # max ICP points = 25

signals:
  weights:                       # base value of one account-level signal
    customer_reference: 40       # competitor case study / logo / testimonial
    conference_talk: 35          # talk or blog by an engineer about running it
    champion_move: 35            # known competitor user joined this company
    job_post: 30                 # hiring for Cassandra / DSE / Astra skills
    github_code: 25              # public org repo imports a Cassandra/DataStax driver (live source)
    tech_stack: 20               # technographic provider says they use it
    review: 20                   # G2 / PeerSpot / TrustRadius review
  confidence: { high: 1.0, medium: 0.8, low: 0.5 }
  recency_half_life_months: 18   # value halves every 18 months
  top_n_signals: 2               # only the two strongest signals count
  max_evidence_points: 60
  why_now:
    window_months: 6
    bonus: 15
    # bonus applies if a signal inside the window ALSO shows intent:
    # extracted why_now is non-empty, OR text matches a keyword, OR type == champion_move
    migration_keywords: ["migrat", "evaluat", "replac", "alternative", "cost", "renewal", "considering", "modernis", "moderniz"]

scoring:
  account_threshold: 60          # account_score >= 60 -> QUALIFIED
  max_leads_per_account: 2

# ---------- Person level ----------
personas:
  decision_maker:
    titles: ["CTO", "VP Engineering", "VP of Engineering", "Head of Engineering", "Head of Platform",
             "Head of Infrastructure", "Director of Engineering", "Director of Data Infrastructure"]
    priority: 1
    angles: ["vp_tco", "vp_cql", "vp_migrate"]
  practitioner:
    titles: ["Principal Engineer", "Staff Engineer", "Staff SRE", "Staff Site Reliability Engineer",
             "Senior Data Engineer", "Database Engineer", "Platform Engineer", "Data Architect", "SRE"]
    priority: 2
    angles: ["vp_latency", "vp_cql"]
  excluded_departments: ["HR", "People", "Finance", "Marketing", "Sales", "Legal"]
  # person ranking inside a qualified account (lower sorts first):
  #   1) persona priority  2) named in a signal (speaker / champion / quoted)  3) profile_skill match
  profile_skill_keywords: ["cassandra", "datastax", "astra db", "cql"]

suppression:                     # checked before anything else
  competitor_domains: ["datastax.com", "ibm.com"]
  existing_customer_domains: ["quantaretail.example"]
  opted_out_emails: ["r.okafor@lumenlogistics.example"]
  already_contacted: true        # any lead with a SENT message in the DB is never re-contacted

# ---------- Human in the loop ----------
hitl:
  auto_send_min_account_score: 80   # threshold mode: >= 80 AND all checks pass -> auto
  # 60-79 -> PENDING_APPROVAL ; < 60 never drafted
  force_review_if:
    - validator_failed_after_retry
    - no_high_confidence_evidence
    - sensitive_content   # mentions a competitor product, the IBM/DataStax acquisition (cf_ibm),
                           # or a renewal/contract - regardless of account score or approval_mode
  production_note: "LinkedIn invites are always sent manually by an SDR; auto applies to email only."

# ---------- Messaging ----------
messaging:
  # The actual prompt version lives in prompts/personalize.md's own header - that's the
  # single source of truth the replay key is built from (hunter/llm.py). A second copy
  # here was dead config (nothing read it) that had drifted to v7 after the prompt was
  # bumped to v8 - removed rather than kept in sync, since nothing can keep two sources
  # of truth in sync automatically.
  sender: { name: "Oz", title: "GTM Engineer", company: "ScyllaDB" }
  linkedin_invite_max_chars: 280   # LinkedIn note limits vary by account type; keep a margin
  email_max_words: 120
  value_props:                     # verify:true = must be confirmed by ScyllaDB product marketing
    - { id: vp_cql,     text: "CQL / Cassandra-compatible, so applications migrate without a rewrite", verify: true }
    - { id: vp_latency, text: "Shard-per-core C++ architecture with no JVM garbage-collection pauses, for predictable p99 latency", verify: true }
    - { id: vp_tco,     text: "Higher throughput per node, which typically means fewer nodes and lower infrastructure cost", verify: true }
    - { id: vp_migrate, text: "Migration tooling and support for moving live Cassandra/DSE workloads", verify: true }
  context_facts:
    # decision_maker only (see §11.5 / routing data from Phase 4): practitioners get a purely
    # technical angle, never vendor-ownership commentary - also enforced by
    # validators.validate_no_ibm_fact_for_practitioner, not just this allow-list.
    - { id: cf_ibm, text: "IBM completed its acquisition of DataStax in May 2025; DataStax offerings are moving under IBM watsonx.", allowed_personas: ["decision_maker"] }
  rules:
    - "Only reference facts present in the lead's evidence items or in context_facts; cite their ids."
    - "Never claim the prospect uses DataStax unless an evidence item with confidence high says so."
    - "No FUD about IBM or DataStax. The acquisition may only be framed as a good moment to review options."
    - "LinkedIn invite: no pitch, no link, one concrete reference to their work."
    - "Email: one value prop matched to persona, one soft call to action, an opt-out line."
    - "cf_ibm (the IBM/DataStax acquisition) may be cited only in a decision_maker email, and only as one short clause - never as the opening sentence, and never the main argument of the message."
    - "A practitioner email stays purely technical: no vendor-ownership or acquisition commentary, and never cite cf_ibm. Speak to their own workload and technology (Cassandra, CQL) rather than naming a vendor, wherever the evidence allows it."
    - "cf_ibm implies this account itself runs a DataStax/Cassandra product. Only cite it if at least one of this account's own evidence items (not a champion_move item, which describes the person's former employer) is high-confidence and shows competitor usage."
  banned_phrases: ["I hope this finds you well", "revolutionary", "game-changer", "synergy", "quick call", "impressive"]

# ---------- Sequencing (trigger rules) ----------
sequence:
  - { id: R1, on: "lead_qualified",       action: "draft_linkedin_invite" }
  - { id: R2, on: "connection_accepted",  action: "draft_email", variant: "warm" }
  - { id: R3, on: "no_accept_after_days", days: 7, action: "draft_email", variant: "cold" }
  # every draft then goes through hitl routing before dispatch

# ---------- Live discovery source (real API) ----------
github_source:
  enabled: false                 # enable with GITHUB_TOKEN; code search requires auth, 10 req/min
  queries: ["com.datastax.oss language:Java", "cassandra-driver filename:requirements.txt", "astrapy filename:requirements.txt"]
  max_results_per_query: 5
  owner_type: "Organization"     # ignore personal repos
  exclude_if_repo_mentions: ["scylla"]   # likely already a ScyllaDB user -> flag, do not target
  # Verified DataStax-owned or DataStax-acquired orgs (not a guess - see AI_WORKFLOW.md for the
  # sourcing on each): stargate was founded by DataStax engineers and the majority of its initial
  # development was DataStax-sponsored (contributions require DataStax's CLA); thelastpickle was
  # acquired by DataStax in March 2020 (DataStax press release, dbta.com, thelastpickle.com's own
  # announcement). A repo under one of these orgs proves the org *is* the competitor, not a target.
  competitor_orgs: ["datastax", "stargate", "thelastpickle"]
  # A match under one of these path segments, or a repo name containing one of these words, is an
  # integration/connector/sample shipped *for* users of the dependency - it proves the dependency
  # exists, not that this org runs it as their own database.
  exclude_if_path_contains: ["integrations/", "connectors/", "examples/", "docs/", "tests/", "tutorials/"]
  exclude_if_repo_name_contains: ["integration", "connector", "sdk", "example", "demo"]
  # A matched path ending in one of these looks like a stale or superseded dependency
  # declaration, not a currently-used one (e.g. requirements.txt.old).
  exclude_if_path_ends_with: [".old", ".bak", ".orig"]
  # Orgs individually verified (by reading the actual repo/requirements file, not guessed - see
  # AI_WORKFLOW.md for the evidence on each) to be multi-backend tools or instrumentation
  # libraries where a DataStax/Cassandra dependency is one of many supported backends, not this
  # org's own database. The generic path/name filters above don't happen to catch these because
  # each project names its integration module differently (a pluggable "node", a driver entry in
  # a long requirements.txt, an auto-instrumentation package) - this list exists because a fixed
  # keyword list cannot anticipate every such name, not because the generic filter was wrong.
  verified_integration_orgs:
    rocketride-org: "store_astra is 1 of 8+ pluggable storage-backend nodes (store_pinecone, store_qdrant, store_milvus, store_postgres, ...) in a swappable pipeline engine"
    AI-Northstar-Tech: "vector-io is a universal multi-vector-database interface; Astra DB is 1 of 9 supported backends alongside Pinecone/Qdrant/Milvus"
    alibaba: "loongsuite-python is an OpenTelemetry-style instrumentation library; its Cassandra package is 1 of dozens of per-library auto-instrumentation modules (Postgres, MySQL, Redis, MongoDB, ...)"
    Dataherald: "the matched requirements.txt lists astrapy alongside 12+ other database connectors (Postgres, MySQL, Snowflake, BigQuery, Databricks, ...) in a natural-language-to-SQL engine that supports many backends"
  # live accounts have no firmographics -> account status NEEDS_ENRICHMENT + generated people-search query
  # without a token, falls back to the committed, dated snapshot (data/github_snapshot.json)
